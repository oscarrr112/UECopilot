name: Agent Governance Gate

on:
  pull_request:
    branches: [master]
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  governance:
    name: Agent Governance Gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Fetch coordinator contract and final review receipt
        uses: actions/github-script@v7
        with:
          script: |
            const prBody = context.payload.pull_request.body || '';
            const references = [...prBody.matchAll(/^Governance-Contract:\s*#(\d+)\s*$/gm)];
            if (references.length !== 1) {
              core.setFailed('PR body must contain exactly one Governance-Contract: #<issue-number> line.');
              return;
            }

            const issueNumber = Number(references[0][1]);
            const { data: contractIssue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
            });
            if (contractIssue.user.login !== context.repo.owner) {
              core.setFailed('Governance contract issue must be authored by the repository owner.');
              return;
            }

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const reviewComments = comments.filter((comment) =>
              comment.user.login === context.repo.owner &&
              /<!-- agent-governance-review:start -->/.test(comment.body || '')
            );
            if (!reviewComments.length) {
              core.setFailed('No owner-authored final agent-governance review receipt exists on this PR.');
              return;
            }

            const fs = require('fs');
            fs.writeFileSync('.governance-contract-body', contractIssue.body || '');
            fs.writeFileSync('.governance-review-body', reviewComments.at(-1).body || '');

      - name: Validate contract, candidate SHA, write set, review, and commands
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from tools.agent_governance_gate import extract_marked_json

          Path('.governance-contract.json').write_text(
              json.dumps(extract_marked_json(Path('.governance-contract-body').read_text(), 'contract')),
              encoding='utf-8',
          )
          Path('.governance-review.json').write_text(
              json.dumps(extract_marked_json(Path('.governance-review-body').read_text(), 'review')),
              encoding='utf-8',
          )
          PY
          python3 tools/agent_governance_gate.py \
            --repo . \
            --head-sha "$CANDIDATE_SHA" \
            --contract .governance-contract.json \
            --review-receipt .governance-review.json
