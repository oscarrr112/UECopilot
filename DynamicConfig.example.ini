[AssetFactoryAI.Dynamic]
; ---- Blueprint protocol ids ----
FunctionEntryNodeId=fn_entry
FunctionResultNodeId=fn_result
ReceiveTickEventName=ReceiveTick
EventTickNodeIdPrefix=event_tick

; ---- Pin alias groups (group1|group2..., each group comma-separated) ----
PinAliasGroups=execute,exec,then,in,input|then,true,out,output|else,false|condition,cond|returnvalue,return,result

; ---- Parent class alias extension ----
; format: alias=ClassPath;alias2=ClassPath2
; ParentClassAliases=ability=/Script/MyGame.BP_Ability_C;npc=/Script/MyGame.BP_NPC_C
ParentClassAliases=

; ---- Rightward layout ----
Rightward.NodeWidth=320
Rightward.NodeHeight=180
Rightward.HorizontalSpacing=380
Rightward.VerticalSpacing=220
Rightward.CollisionPadding=40

; ---- Declared-order layout ----
Declared.StartX=160
Declared.StartY=120
Declared.StepX=320
Declared.StepY=180

; ---- Auto layout (CreateBlueprint path) ----
AutoLayout.HorizontalSpacing=350
AutoLayout.VerticalSpacing=120
AutoLayout.PrioritizeExecFlow=false

; ---- Post layout pass ----
PostLayout.HorizontalSpacing=380
PostLayout.VerticalSpacing=180
PostLayout.PrioritizeExecFlow=true

; ---- NodeSpawner function resolution ----
NodeSpawner.FunctionLibraries=/Script/Engine.KismetSystemLibrary,/Script/Engine.KismetMathLibrary,/Script/Engine.KismetStringLibrary,/Script/Engine.KismetTextLibrary,/Script/Engine.KismetArrayLibrary,/Script/Engine.GameplayStatics,/Script/Engine.KismetMaterialLibrary,/Script/Engine.KismetRenderingLibrary,/Script/Engine.KismetInputLibrary

; ---- NodeSpawner events ----
NodeSpawner.Event.BeginPlay=ReceiveBeginPlay
NodeSpawner.Event.Tick=ReceiveTick

; ---- NodeSpawner flow candidates ----
NodeSpawner.Flow.DelayCandidates=/Script/Engine.KismetSystemLibrary.Delay
NodeSpawner.Flow.DoOnceCandidates=/Script/Engine.KismetSystemLibrary.DoOnce
NodeSpawner.Flow.ForLoopCandidates=/Script/Engine.KismetSystemLibrary.ForLoop,/Script/Engine.KismetMathLibrary.ForLoop
NodeSpawner.Flow.WhileLoopCandidates=/Script/Engine.KismetSystemLibrary.WhileLoop

; ---- Factory error messages ----
Factory.Error.BlueprintNameRequired=Blueprint name is required
Factory.Error.ResolveParentClass=Could not resolve parent class: %s
Factory.Error.BlueprintExists=Blueprint already exists at: %s. Use /modify to modify existing blueprints.
Factory.Error.CreatePackageFailed=Failed to create package: %s
Factory.Error.CreateBlueprintFailed=Failed to create blueprint
Factory.Error.CreatePreviewBlueprintFailed=Failed to create preview blueprint
Factory.Error.BlueprintNull=Blueprint is null

; ---- NodeSpawner error messages ----
NodeSpawner.Error.InvalidGraphOrBlueprint=Invalid graph or blueprint
NodeSpawner.Error.UnknownEventType=Unknown event type
NodeSpawner.Error.FailedCreateEventNode=Failed to create event node
NodeSpawner.Error.ForLoopNotFound=ForLoop function not found - use ForLoopWithBreak macro instead
NodeSpawner.Error.WhileLoopNotFound=WhileLoop not directly available - implement using Branch in a loop
NodeSpawner.Error.FlowFunctionNotFound=Flow control function not found
NodeSpawner.Error.FlowNodeTypeNotImplemented=Flow control node type not yet implemented
NodeSpawner.Error.FailedCreateFlowNode=Failed to create flow control node
NodeSpawner.Error.VariableNameEmpty=Variable name is empty
NodeSpawner.Error.FailedCreateVariableNode=Failed to create variable node
NodeSpawner.Error.UnknownMathOperation=Unknown math operation
NodeSpawner.Error.UnknownComparisonOperation=Unknown comparison operation
NodeSpawner.Error.UnknownLogicOperation=Unknown logic operation
NodeSpawner.Error.UnknownArrayOperation=Unknown array operation
NodeSpawner.Error.ReturnNodeOnlyInFunctionGraph=Return node can only be used in function graphs
